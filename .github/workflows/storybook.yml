name: Storybook

on:
  pull_request:
    paths:
      - '.github/workflows/storybook.yml'
      - '.storybook/**'
      - 'src-vue/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  visual-review:
    name: Story interactions and visual diffs (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Restore runtime client cache
        uses: ./.github/actions/runtime-client-cache

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Capture main visual states
        id: baseline-tests
        continue-on-error: true
        run: yarn storybook:test
        env:
          STORYBOOK_SCREENSHOT_DIR: ${{ runner.temp }}/visual-review/expected

      - name: Checkout pull request
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Restore pull request runtime client cache
        uses: ./.github/actions/runtime-client-cache

      - name: Install pull request dependencies
        run: yarn install --immutable

      - name: Build pull request Storybook
        run: yarn storybook:build

      - name: Capture pull request visual states
        id: pull-request-tests
        continue-on-error: true
        run: yarn storybook:test
        env:
          STORYBOOK_SCREENSHOT_DIR: ${{ runner.temp }}/visual-review/actual

      - name: Compare visual states
        if: steps.baseline-tests.outcome == 'success' && steps.pull-request-tests.outcome == 'success'
        id: visual-diffs
        run: |
          report_dir="$RUNNER_TEMP/visual-review"
          yarn dlx reg-cli@0.18.16 "$report_dir/actual" "$report_dir/expected" "$report_dir/diff" \
            --report "$report_dir/index.html" \
            --json "$report_dir/reg.json" \
            --ignoreChange \
            --extendedErrors

          {
            echo "changed=$(jq '.failedItems | length' "$report_dir/reg.json")"
            echo "added=$(jq '.newItems | length' "$report_dir/reg.json")"
            echo "removed=$(jq '.deletedItems | length' "$report_dir/reg.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload visual diff report
        if: steps.baseline-tests.outcome == 'success' && steps.pull-request-tests.outcome == 'success'
        id: visual-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-visual-diffs-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/visual-review
          if-no-files-found: error
          retention-days: 14

      - name: Summarize interaction tests
        if: always()
        run: |
          {
            echo "### Story interactions"
            echo "Main: ${{ steps.baseline-tests.outcome }}"
            echo "Pull request: ${{ steps.pull-request-tests.outcome }}"
            echo "This check is informational while the initial story catalog is being stabilized."
            if [[ "${{ steps.visual-artifact.outputs.artifact-url }}" != "" ]]; then
              echo
              echo "### Visual review"
              echo "Changed: ${{ steps.visual-diffs.outputs.changed }} · Added: ${{ steps.visual-diffs.outputs.added }} · Removed: ${{ steps.visual-diffs.outputs.removed }}"
              echo "[Download the visual diff report](${{ steps.visual-artifact.outputs.artifact-url }})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Link visual review
    if: always()
    needs: visual-review
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Update pull request comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_dir="$RUNNER_TEMP/visual-review"
          body_file="$RUNNER_TEMP/visual-review-comment.md"
          marker='<!-- storybook-visual-diffs -->'
          attachments=()

          if gh run download "$GITHUB_RUN_ID" --name "storybook-visual-diffs-${{ github.event.pull_request.number }}" --dir "$report_dir" \
            && [[ -f "$report_dir/reg.json" ]]; then
            changed=$(jq '.failedItems | length' "$report_dir/reg.json")
            added=$(jq '.newItems | length' "$report_dir/reg.json")
            removed=$(jq '.deletedItems | length' "$report_dir/reg.json")
            {
              echo "$marker"
              echo '## Storybook visual review'
              echo
              echo "Changed: ${changed} · Added: ${added} · Removed: ${removed}"
            } > "$body_file"

            cd "$report_dir"
            while IFS= read -r image; do
              path="./diff/${image}"
              [[ -f "$path" ]] || continue
              printf '\n### Changed: <code>%s</code>\n\n![Visual difference](%s)\n' "$image" "$path" >> "$body_file"
              attachments+=(--attach "${path}#Visual difference for ${image}")
            done < <(jq -r '.failedItems[:50][]' reg.json)

            while (( ${#attachments[@]} < 50 )) && IFS= read -r image; do
              path="./actual/${image}"
              [[ -f "$path" ]] || continue
              printf '\n### Added: <code>%s</code>\n\n![Added visual state](%s)\n' "$image" "$path" >> "$body_file"
              attachments+=(--attach "${path}#Added visual state ${image}")
            done < <(jq -r '.newItems[]' reg.json)

            while (( ${#attachments[@]} < 50 )) && IFS= read -r image; do
              path="./expected/${image}"
              [[ -f "$path" ]] || continue
              printf '\n### Removed: <code>%s</code>\n\n![Removed visual state](%s)\n' "$image" "$path" >> "$body_file"
              attachments+=(--attach "${path}#Removed visual state ${image}")
            done < <(jq -r '.deletedItems[]' reg.json)
          else
            printf '%s\n## Storybook visual review\n\nVisual comparison was unavailable because the base or pull-request story capture did not complete.\n' \
              "$marker" > "$body_file"
          fi

          gh pr comment --help | grep -q -- '--attach' || {
            echo '::error::The runner requires GitHub CLI 2.99 or newer to attach visual diffs.'
            exit 1
          }

          gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
            | while read -r comment_id; do
                gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"
              done

          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$body_file" "${attachments[@]}"
