name: Storybook

on:
  push:
    paths:
      - '.github/workflows/storybook.yml'
      - '.storybook/**'
      - 'src-vue/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.json'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  interaction-tests:
    name: Story interactions (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run story interactions
        id: storybook-tests
        continue-on-error: true
        run: yarn storybook:test

      - name: Summarize interaction tests
        if: always()
        run: |
          {
            echo "### Story interactions"
            echo "Result: ${{ steps.storybook-tests.outcome }}"
            echo "This check is informational while the initial story catalog is being stabilized."
          } >> "$GITHUB_STEP_SUMMARY"

  changed-ui-states:
    name: Changed UI states
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Storybook
        run: yarn storybook:build

      - name: Publish changed UI states
        id: chromatic
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          onlyChanged: true
          exitZeroOnChanges: true
          autoAcceptChanges: main

      - name: Link Storybook review
        if: always() && steps.chromatic.outputs.buildUrl != '' && steps.chromatic.outputs.storybookUrl != ''
        run: |
          {
            echo "### Storybook"
            echo "[Review changed UI states](${{ steps.chromatic.outputs.buildUrl }})"
            echo "[Browse the complete PR Storybook](${{ steps.chromatic.outputs.storybookUrl }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Link Storybook in pull request
        if: always() && steps.chromatic.outputs.buildUrl != '' && steps.chromatic.outputs.storybookUrl != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMATIC_BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
          CHROMATIC_STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
        run: |
          pr_number=$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            --jq 'first | .number // empty')

          if [[ -z "$pr_number" ]]; then
            echo "::notice::No open pull request was found for ${GITHUB_REF_NAME}."
            exit 0
          fi

          marker='<!-- chromatic-pr-links -->'
          body="${marker}
          ## Storybook review

          - [Review changed UI states](${CHROMATIC_BUILD_URL})
          - [Browse the complete PR Storybook](${CHROMATIC_STORYBOOK_URL})

          Updated for commit \`${GITHUB_SHA:0:7}\`."
          comment_id=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body"
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" -f body="$body"
          fi
