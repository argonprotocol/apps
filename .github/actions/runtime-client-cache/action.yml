name: Runtime client cache
description: Restore immutable runtime sources shared by runtime client generation

runs:
  using: composite
  steps:
    - name: Configure runtime client cache
      shell: bash
      run: echo "ARGON_RUNTIME_CLIENT_CACHE=$GITHUB_WORKSPACE/../.argon-runtime-client-cache" >> "$GITHUB_ENV"

    - name: Restore runtime client cache
      uses: actions/cache@v6.1.0
      with:
        path: ../.argon-runtime-client-cache
        key: runtime-client-v2-${{ hashFiles('runtime-client/src/history/RuntimeSources.json') }}
        restore-keys: |
          runtime-client-v2-
          runtime-client-v1-
        enableCrossOsArchive: true
