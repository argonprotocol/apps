services:
  archive-node:
    entrypoint: ['argon-node', '--compute-flags=${ARGON_TEST_COMPUTE_FLAGS:-light}']
    environment:
      RUST_LOG: ${ARGON_TEST_RUST_LOG:-info,argon=info,pallet=trace}
    healthcheck:
      start_period: 120s
  miner-1:
    entrypoint: ['argon-node', '--compute-flags=${ARGON_TEST_COMPUTE_FLAGS:-light}']
    environment:
      RUST_LOG: ${ARGON_TEST_RUST_LOG:-info,argon=info,pallet=trace}
  miner-2:
    entrypoint: ['argon-node', '--compute-flags=${ARGON_TEST_COMPUTE_FLAGS:-light}']
    environment:
      RUST_LOG: ${ARGON_TEST_RUST_LOG:-info,argon=info,pallet=trace}
  indexer:
    environment:
      ARGON_CHAIN: dev-docker
